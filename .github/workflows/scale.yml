# The scale bench of the home (packages/sqlite/scale, roadmap SQ-26). Each rung is a log of 10^3 to 10^7 events, in a
# file of 1 MB to 10 GB. For each rung, the fresh runner of @mark1russell7/rigor-bench starts a child for each measure
# and round: the append, the read after a position, the read by id, the open, the migrate of an older file, the count,
# the recovery after a SIGKILL and the quick check.
#
# The times depend on the runner, so the bench operates only in CI. Each job measures all the rungs of the run on one
# runner. Thus the growth of a measure from one rung to the next comes from one computer, and the speed of the computer
# cancels. The job growth gives the verdict of each measure against the claim of its class: a flat measure grows at most
# 2 times for 10 times the events, and a linear measure at most 20 times (scale/shared.ts). Six runners give the
# interval of the median growth the coverage 0.969.
#
# The job growth also gives the candidate budgets of each rung, as a report. The CPU models of the runners differ by up
# to 4 times, so a budget of a time is not a gate.
#
# A pull request that changes the code of the package starts the three small rungs on 6 runners. The weekly run measures
# each rung on 6 runners, because a new Node.js can bring a new SQLite.
name: Scale

on:
  # A person starts a run: gh workflow run scale.yml --ref <branch> -f jobs=6
  workflow_dispatch:
    inputs:
      jobs:
        description: The count of jobs, from 1 to 8. Each job measures each rung on its runner. A growth verdict needs 6.
        default: "6"
      rungs:
        description: The rungs, as a JSON list of event counts from 1000 to 10000000.
        default: "[1000, 10000, 100000, 1000000, 10000000]"
  schedule:
    - cron: "50 7 * * 3"
  # Each pull request starts the workflow, thus the ruleset can ask for "Scale OK". The job changes skips the rungs of a
  # pull request that does not change the package.
  pull_request:

permissions:
  contents: read

concurrency:
  group: scale-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@dc370269d67c8cdb26957ae96273dbb9e5432343 # main
        with:
          # A change of the source can change a growth, so it starts the bench too
          paths: |
            packages/sqlite/scale/**
            packages/sqlite/src/**
            packages/sqlite/package.json
            pnpm-lock.yaml
            .github/workflows/scale.yml

  plan:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      rungs: ${{ steps.plan.outputs.rungs }}
      large: ${{ steps.plan.outputs.large }}
    steps:
      - name: Make the matrix of jobs and the list of rungs
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          JOBS: ${{ inputs.jobs }}
          RUNGS: ${{ inputs.rungs }}
        run: |
          case "$EVENT" in
            pull_request) rungs='[1000, 10000, 100000]'; jobs=6 ;;
            schedule) rungs='[1000, 10000, 100000, 1000000, 10000000]'; jobs=6 ;;
            *) rungs="$RUNGS"; jobs="$JOBS" ;;
          esac
          plan="$(jq -cn --argjson rungs "$rungs" --argjson jobs "$jobs" '
            if ($jobs | type) != "number" or $jobs < 1 or $jobs > 8 or ($jobs | floor) != $jobs then error("jobs must be a whole number from 1 to 8")
            elif ($rungs | type) != "array" or ($rungs | length) == 0 or ($rungs - [1000, 10000, 100000, 1000000, 10000000] | length) > 0 then error("each rung must be one of 1000, 10000, 100000, 1000000 and 10000000")
            else {matrix: {include: [range(1; $jobs + 1) as $job | {job: $job}]}, rungs: ($rungs | unique | map(tostring) | join(",")), large: (($rungs | max) >= 1000000)} end')"
          {
            echo "matrix=$(jq -c .matrix <<< "$plan")"
            echo "rungs=$(jq -r .rungs <<< "$plan")"
            echo "large=$(jq -r .large <<< "$plan")"
          } >> "$GITHUB_OUTPUT"
          echo "The plan: $plan" >> "$GITHUB_STEP_SUMMARY"

  bench:
    name: Rungs on runner ${{ matrix.job }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # The runners are shared by all repositories of the account (the rule runner-budget)
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Free the disk for the large rungs
        if: ${{ needs.plan.outputs.large == 'true' }}
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Measure each rung on this runner
        env:
          RUNGS: ${{ needs.plan.outputs.rungs }}
          JOB: ${{ matrix.job }}
          # Unique in the run and its attempts, so a job that starts again is a different runner
          RUNNER_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.job }}
        run: >-
          node --disable-warning=ExperimentalWarning packages/sqlite/scale/run.ts
          --events "$RUNGS" --rounds 6 --job "$JOB" --runner "$RUNNER_ID"
          --dir "$RUNNER_TEMP/scale" --records "$RUNNER_TEMP/records"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: scale-job-${{ matrix.job }}
          path: ${{ runner.temp }}/records/
          if-no-files-found: warn
          overwrite: true
          retention-days: 90

  growth:
    needs: [changes, plan, bench]
    if: ${{ !cancelled() && needs.changes.outputs.match == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scale-job-*
          merge-multiple: true
          path: ${{ runner.temp }}/records
      - name: Give the growth verdict of each measure
        run: node packages/sqlite/scale/growth.ts "$RUNNER_TEMP/records" "$RUNNER_TEMP/scale-growth.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Give the candidate budgets of each rung
        if: ${{ !cancelled() }}
        run: node packages/sqlite/scale/limits.ts "$RUNNER_TEMP/records" "$RUNNER_TEMP/scale-limits.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: scale-verdicts
          path: |
            ${{ runner.temp }}/scale-growth.json
            ${{ runner.temp }}/scale-limits.json
          if-no-files-found: warn
          retention-days: 90

  scale-ok:
    name: Scale OK
    if: ${{ !cancelled() }}
    needs: [changes, plan, bench, growth]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@dc370269d67c8cdb26957ae96273dbb9e5432343 # main
        with:
          needs: ${{ toJSON(needs) }}
