# The scale bench of the home (packages/sqlite/scale, roadmap SQ-26). Each rung is a log of 10^3 to 10^7 events, in a
# file of 1 MB to 10 GB. For each rung, the fresh runner of @mark1russell7/rigor-bench starts a child for each measure
# and round: the append, the read after a position, the read by id, the open, the migrate of an older file, the count,
# the recovery after a SIGKILL and the quick check.
#
# The times depend on the runner, so the bench operates only in CI. The rule of the gate limits: a limit is the worst of
# 5 or more CI runs plus their spread. Thus a manual run starts 5 jobs of each rung, and the job limits gives the
# candidate limits. A pull request writes them into the ladder. Until then, no rung is locked and the bench blocks nothing.
#
# A pull request that changes the bench starts the three small rungs once. The weekly run records each rung once, because
# a new Node.js can bring a new SQLite.
name: Scale

on:
  # A person starts a run of the limits: gh workflow run scale.yml --ref <branch> -f jobs=5
  workflow_dispatch:
    inputs:
      jobs:
        description: The count of jobs of each rung, from 1 to 8. A limit needs 5 or more.
        default: "5"
      rungs:
        description: The rungs, as a JSON list of event counts from 1000 to 10000000.
        default: "[1000, 10000, 100000, 1000000, 10000000]"
  schedule:
    - cron: "41 7 * * 3"
  pull_request:
    paths:
      - packages/sqlite/scale/**
      - .github/workflows/scale.yml

permissions:
  contents: read

concurrency:
  group: scale-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Make the matrix of rungs and jobs
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          JOBS: ${{ inputs.jobs }}
          RUNGS: ${{ inputs.rungs }}
        run: |
          case "$EVENT" in
            pull_request) rungs='[1000, 10000, 100000]'; jobs=1 ;;
            schedule) rungs='[1000, 10000, 100000, 1000000, 10000000]'; jobs=1 ;;
            *) rungs="$RUNGS"; jobs="$JOBS" ;;
          esac
          matrix="$(jq -cn --argjson rungs "$rungs" --argjson jobs "$jobs" '
            if ($jobs | type) != "number" or $jobs < 1 or $jobs > 8 or ($jobs | floor) != $jobs then error("jobs must be a whole number from 1 to 8")
            elif ($rungs | type) != "array" or ($rungs | length) == 0 or ($rungs - [1000, 10000, 100000, 1000000, 10000000] | length) > 0 then error("each rung must be one of 1000, 10000, 100000, 1000000 and 10000000")
            else {include: [$rungs[] as $events | range(1; $jobs + 1) as $job | {events: $events, job: $job}]} end')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "The matrix: $matrix" >> "$GITHUB_STEP_SUMMARY"

  rung:
    name: Rung ${{ matrix.events }} events (job ${{ matrix.job }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # The runners are shared by all repositories of the account (the rule runner-budget)
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Free the disk for the large rungs
        if: ${{ matrix.events >= 1000000 }}
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Measure the rung
        env:
          EVENTS: ${{ matrix.events }}
          JOB: ${{ matrix.job }}
        run: >-
          node --disable-warning=ExperimentalWarning packages/sqlite/scale/run.ts
          --events "$EVENTS" --rounds 6 --job "$JOB"
          --dir "$RUNNER_TEMP/scale" --out "$RUNNER_TEMP/records/scale-$EVENTS-job-$JOB.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: scale-${{ matrix.events }}-job-${{ matrix.job }}
          path: ${{ runner.temp }}/records/
          if-no-files-found: warn
          retention-days: 90

  limits:
    needs: rung
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scale-*
          merge-multiple: true
          path: ${{ runner.temp }}/records
      - name: Give the candidate limits
        run: node packages/sqlite/scale/limits.ts "$RUNNER_TEMP/records" "$RUNNER_TEMP/scale-limits.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scale-limits
          path: ${{ runner.temp }}/scale-limits.json
          retention-days: 90
